name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the package version includes the commit count
          submodules: true   # Dhruva is packaged from its submodule

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gsettings-desktop-schemas \
            libglib2.0-bin fakeroot desktop-file-utils

      - name: Check syntax
        run: python3 -m py_compile tuneup.py store.py system.py audio.py market.py

      - name: Run tests
        run: python3 -m unittest discover tests -v

      - name: Validate desktop entry
        run: desktop-file-validate packaging/io.github.doeshing.Tuneup.desktop

      - name: Build deb
        env:
          MAINTAINER: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
        run: |
          ./packaging/build-deb.sh
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Check the packaged modules import
        run: |
          dpkg-deb -x dist/*.deb pkgroot
          cd pkgroot/usr/share/tuneup
          python3 -c "import store, system, audio, market"

      - uses: actions/upload-artifact@v4
        with:
          name: tuneup-deb
          path: dist/*.deb
          if-no-files-found: error
